<div class="admin">

  @if (sidebarOpen()) {
    <div class="admin__overlay" (click)="closeSidebar()"></div>
  }

  <aside class="sidebar" [class.sidebar--open]="sidebarOpen()">
    <div class="sidebar__head">
      <!-- En móvil vuelve a caer justo donde está el botón de hamburguesa del
           topbar (que queda tapado por el drawer abierto): así el gesto natural
           de "volver a tocar ahí para cerrar" funciona. Oculto en escritorio,
           donde el drawer es fijo. -->
      <button
        type="button"
        class="sidebar__close"
        (click)="closeSidebar()"
        aria-label="Cerrar menú"
      >
        <span class="material-symbols-outlined">close</span>
      </button>
      <span class="sidebar__brand">
        <span class="sidebar__ornament">☾</span>
        <span class="sidebar__brand-text">
          Estilo y Confort
          <small>{{ panelSubtitle() }}</small>
        </span>
      </span>
    </div>

    <nav class="sidebar__nav">
      @for (item of navItems(); track item.label) {
        <a
          class="nav-link"
          [routerLink]="item.route"
          routerLinkActive="nav-link--active"
          [routerLinkActiveOptions]="{ exact: false }"
          (click)="closeSidebar()"
        >
          <span class="material-symbols-outlined">{{ item.icon }}</span>
          <span class="nav-link__label">{{ item.label }}</span>
          @if (item.badge && item.badge() > 0) {
            <span class="nav-link__count">{{ item.badge() }}</span>
          }
        </a>
      }
    </nav>

    <button type="button" class="sidebar__logout" (click)="logout()">
      <span class="material-symbols-outlined">logout</span>
      Cerrar sesión
    </button>
  </aside>

  <div class="admin__main">
    <header class="topbar">
      <button
        type="button"
        class="topbar__menu"
        (click)="toggleSidebar()"
        aria-label="Abrir menú"
      >
        <span class="material-symbols-outlined">menu</span>
      </button>

      <div class="topbar__actions">
        <ng-content select="[topbarActions]" />
        <div class="topbar__user">
          <div class="topbar__user-info">
            <span class="topbar__user-name">{{ userName() }}</span>
            <span class="topbar__user-email">{{ userEmail() }}</span>
          </div>
          <span class="topbar__avatar material-symbols-outlined">account_circle</span>
        </div>
      </div>
    </header>

    <main class="admin__content">
      <router-outlet />
    </main>
  </div>

</div>
