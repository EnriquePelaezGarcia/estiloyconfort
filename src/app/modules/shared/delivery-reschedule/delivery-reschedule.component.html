<div class="backdrop" (click)="close()"></div>

<div class="modal" role="dialog" aria-modal="true" aria-labelledby="reschedule-title">
  <header class="modal__header">
    <h2 id="reschedule-title" class="modal__title">Reprogramar entrega</h2>
    <button type="button" class="modal__close" (click)="close()" aria-label="Cerrar">
      <span class="material-symbols-outlined">close</span>
    </button>
  </header>

  <p class="modal__subject">{{ orderNumber() }} · {{ customerName() }}</p>

  <form (ngSubmit)="submit()" class="modal__form">
    <app-delivery-schedule-fields
      [expectedDeliveryDate]="expectedDeliveryDate()"
      [currentCommitment]="currentCommitment()"
      [windowStart]="windowStart()"
      [windowEnd]="windowEnd()"
      [slotId]="slotId()"
      [hasPendingFabrication]="hasPendingFabrication()"
    />

    <footer class="modal__actions">
      <button type="button" class="btn btn--ghost" (click)="close()" [disabled]="saving()">Cancelar</button>
      <button type="submit" class="btn btn--primary" [disabled]="saving()">
        {{ saving() ? 'Guardando…' : 'Guardar cambio' }}
      </button>
    </footer>
  </form>
</div>
