# ==================== PRODUCCIÓN ====================
# Si algún día cambias de dominio, reemplaza estiloyconfortm.com aquí,
# en staging.conf, en los .env y en src/environments/.

# ---- HTTP: solo sirve para el reto de Let's Encrypt y para redirigir ----
server {
    listen 80;
    listen [::]:80;
    server_name estiloyconfortm.com www.estiloyconfortm.com api.estiloyconfortm.com;

    # Certbot deja aquí un archivo temporal para probar que el dominio es tuyo.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- www → sin www (un solo dominio canónico, mejor para SEO) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.estiloyconfortm.com;

    ssl_certificate     /etc/letsencrypt/live/estiloyconfortm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/estiloyconfortm.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://estiloyconfortm.com$request_uri;
}

# ---- Frontend Angular (SSR) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name estiloyconfortm.com;

    ssl_certificate     /etc/letsencrypt/live/estiloyconfortm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/estiloyconfortm.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Cabeceras de seguridad básicas.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Comprimir HTML/JS/CSS ahorra ancho de banda y acelera la carga.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://frontend-prod:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ---- API Express ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.estiloyconfortm.com;

    ssl_certificate     /etc/letsencrypt/live/estiloyconfortm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/estiloyconfortm.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # La evidencia de entrega manda foto + firma en base64 dentro del JSON
    # (el backend acepta 15 MB, ver backend/src/index.js). Con 20 MB hay margen.
    client_max_body_size 20m;

    location / {
        proxy_pass http://backend-prod:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Las imágenes de productos se cachean fuerte: el nombre lleva timestamp,
    # así que un archivo nunca cambia de contenido.
    location /uploads/ {
        proxy_pass http://backend-prod:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
