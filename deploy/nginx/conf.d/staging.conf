# ==================== PREPRODUCCIÓN ====================
# Mismo esquema que producción, pero apuntando a los contenedores de staging
# y con una diferencia importante: se bloquea la indexación en buscadores.

server {
    listen 80;
    listen [::]:80;
    server_name dev.estiloyconfortm.com api-dev.estiloyconfortm.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Frontend de pruebas ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.estiloyconfortm.com;

    ssl_certificate     /etc/letsencrypt/live/estiloyconfortm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/estiloyconfortm.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Que Google NUNCA indexe el ambiente de pruebas: si lo hace, tus clientes
    # podrían llegar a datos falsos desde una búsqueda.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://frontend-staging:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ---- API de pruebas ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api-dev.estiloyconfortm.com;

    ssl_certificate     /etc/letsencrypt/live/estiloyconfortm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/estiloyconfortm.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 20m;

    location / {
        proxy_pass http://backend-staging:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
